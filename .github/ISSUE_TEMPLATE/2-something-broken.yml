name: Something doesn't work
description: Install fails, a skill doesn't load, a link or file is broken.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Paste the error if there is one.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Claude Code (and its version from `claude --version`), the Claude apps, or another assistant.
